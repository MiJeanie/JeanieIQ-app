<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>JeanieIQ Employee</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#0A1F44;color:#f1f5f9;font-family:-apple-system,system-ui,sans-serif;
    text-align:center;padding:32px}
  .w{max-width:320px}
  h1{font-size:20px;font-weight:700;margin:0 0 10px}
  p{font-size:14px;line-height:1.6;color:#a9b8d4;margin:0 0 22px}
  button{background:#f1f5f9;color:#0A1F44;border:none;border-radius:12px;
    padding:14px 26px;font:600 14px -apple-system,system-ui,sans-serif;cursor:pointer}
</style>
</head>
<body>
<!-- Shown only when the phone cannot reach the live app at launch; server.url normally loads it. -->
<div class="w">
  <h1>No connection</h1>
  <p>JeanieIQ Employee needs a connection to load your details. Check your signal or Wi-Fi and try again.</p>
  <button onclick="location.reload()">Try again</button>
</div>
</body>
</html>
