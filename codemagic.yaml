        includes: ['employee/ios/**', 'employee/www/**', 'employee/capacitor.config.json', 'employee/package.json', 'employee/package-lock.json', 'codemagic.yaml']
    integrations:
      app_store_connect: JeanieIQ
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.jeanieiq.employee.dev
      vars:
        BUNDLE_ID: com.jeanieiq.employee.dev
      node: 22
      xcode: latest
    scripts: *ios_scripts
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing: *ios_publishing

  employee-android:
    name: JeanieIQ Employee Android
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: employee
    triggering:
      events: [push]
      branch_patterns:
        - pattern: main
          include: true
          source: true
    when:
      changeset:
        includes: ['employee/android/**', 'employee/www/**', 'employee/capacitor.config.json', 'employee/package.json', 'employee/package-lock.json', 'codemagic.yaml']
    environment:
      android_signing:
        - mijeanie_upload
      groups:
        - google_play
      vars:
